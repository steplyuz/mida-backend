[project]
name = "mida-backend"
version = "0.1.0"
description = "MIDA transaction-trust platform backend (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Plain uvicorn: the [standard] extra pulls uvloop, which has no Windows build.
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "telethon>=1.36",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "telegram_live: requires real Telegram credentials and accounts; excluded by default",
]
addopts = "-m 'not telegram_live'"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"alembic/**" = ["S608"]
"demo/**" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "alembic", "tests"]

# Telethon ships without type stubs. Its surface is isolated in app/integrations/telegram/mtproto.py.
[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true
